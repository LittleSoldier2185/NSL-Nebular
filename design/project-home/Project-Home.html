<title>Project Home</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: แถบเลือกแบบด้านบน แล้วจำลองหน้าต่าง Home เต็มความกว้างด้านล่าง ; สีเอกสาร 6 ชนิดคงตามแอป */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --surface2:#F6F8FB; --border:#D8DEE6; --border2:#E6EAF0; --input:#CBD3DE;
  --text:#1B2430; --muted:#5B6778; --primary:#0F766E; --primary-ink:#FFFFFF; --tint:#E2F3F1;
  --danger:#C0392B; --warn:#B7791F; --ok:#0F766E;
  --er:#2F9E8F; --dfd:#4A86C8; --fc:#7B5CD6; --wf:#D49A3A; --sf:#D0507F; --api:#3A93B0;
  --sans:'Noto Sans Thai',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A0E14; --surface:#161E29; --surface2:#1C2633; --border:#2C3947; --border2:#222E3B; --input:#3B4859;
  --text:#E6EBF2; --muted:#93A0B2; --primary:#1FA89B; --primary-ink:#04201D; --tint:#12332F;
  --danger:#F07A6C; --warn:#E5B24D; --ok:#4FD1B5;
  --er:#3FB5A5; --dfd:#6FA3E0; --fc:#9B82E6; --wf:#E0AC55; --sf:#E26C97; --api:#56B0CC; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A0E14; --surface:#161E29; --surface2:#1C2633; --border:#2C3947; --border2:#222E3B; --input:#3B4859;
  --text:#E6EBF2; --muted:#93A0B2; --primary:#1FA89B; --primary-ink:#04201D; --tint:#12332F;
  --danger:#F07A6C; --warn:#E5B24D; --ok:#4FD1B5;
  --er:#3FB5A5; --dfd:#6FA3E0; --fc:#9B82E6; --wf:#E0AC55; --sf:#E26C97; --api:#56B0CC; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:13px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.top{max-width:1180px;margin:0 auto 14px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.top h1{margin:0 0 2px;font-size:19px}
.top p{margin:0;color:var(--muted);max-width:62ch}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{height:34px;padding:0 12px;border:1px solid var(--input);border-radius:8px;background:var(--surface)}
.seg button[aria-pressed=true]{border-color:var(--primary);background:var(--tint);font-weight:600}
.opts{max-width:1180px;margin:0 auto 14px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center}
.opts label{display:flex;gap:6px;align-items:center;color:var(--muted)}
.note{max-width:1180px;margin:0 auto 14px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 16px}
.note h2{margin:0 0 4px;font-size:14px}
.note ul{margin:4px 0 0;padding-left:18px;color:var(--muted)}
.win{max-width:1180px;margin:0 auto;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:28px;overflow:hidden}
@media(max-width:640px){.win{padding:16px}}
/* ชิ้นส่วนร่วม */
.eyebrow{font-size:12px;color:var(--muted);letter-spacing:.06em}
.name{font-size:30px;line-height:1.2;font-weight:700;margin:2px 0 6px}
.meta{display:flex;flex-wrap:wrap;gap:2px 8px;color:var(--muted);font-size:13px}
.meta .dirty{color:var(--warn);font-weight:600}
.btn{height:36px;padding:0 14px;border:1px solid var(--input);border-radius:9px;background:var(--surface);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn.pri{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;font-weight:500}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px}
.panel>h3{margin:0;padding:13px 16px;font-size:14px;border-bottom:1px solid var(--border2);display:flex;align-items:center;gap:8px}
.cnt{margin-left:auto;font-size:12px;color:var(--muted);border:1px solid var(--border);border-radius:10px;padding:0 8px;font-weight:500}
.cnt.bad{color:var(--danger);border-color:var(--danger)}
.dot{width:9px;height:9px;border-radius:3px;flex:none;display:inline-block}
.row{display:flex;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid var(--border2);min-width:0}
.row:first-of-type{border-top:0}
.row .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .k{color:var(--muted)}
.row .when{color:var(--muted);font-size:12px;flex:none}
.badge{font-size:11px;border-radius:9px;padding:0 7px;font-weight:600;flex:none}
.badge.e{background:color-mix(in srgb,var(--danger) 18%,transparent);color:var(--danger)}
.badge.w{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.badge.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.linkline{padding:10px 16px;border-top:1px solid var(--border2);color:var(--primary);font-size:12.5px}
.empty{padding:14px 16px;color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.ico{width:16px;height:16px;flex:none}
.sectitle{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
/* A: การ์ดเท่ากัน */
.cards{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
@media(max-width:980px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:560px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{background:var(--surface);border:1px solid var(--border);border-top:3px solid var(--c);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;text-align:left;min-height:138px}
.card .ty{display:flex;align-items:center;gap:7px;font-weight:600;color:var(--c);font-size:12.5px}
.card .n{font-size:28px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.card .d{color:var(--muted);font-size:12px;flex:1}
.card .go{align-self:flex-start;color:var(--c);font-weight:600;font-size:12.5px}
.card.add{border-style:dashed;border-top-width:1px;color:var(--muted);align-items:center;justify-content:center;background:transparent}
.grid2{display:grid;grid-template-columns:minmax(0,64fr) minmax(0,36fr);gap:20px;align-items:start}
@media(max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:20px}
details.more>summary{list-style:none;cursor:pointer;padding:10px 16px;border-top:1px solid var(--border2);color:var(--muted);font-size:12.5px}
details.more>summary::-webkit-details-marker{display:none}
/* B: สายงาน */
.pipe{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:0;position:relative}
@media(max-width:980px){.pipe{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}
.step{background:var(--surface);border:1px solid var(--border);padding:12px 12px 12px 16px;position:relative;display:flex;flex-direction:column;gap:3px;min-height:132px;text-align:left}
.step:first-child{border-radius:12px 0 0 12px}.step:last-child{border-radius:0 12px 12px 0}
@media(max-width:980px){.step,.step:first-child,.step:last-child{border-radius:12px}}
.step+.step{border-left-width:0}
@media(max-width:980px){.step+.step{border-left-width:1px}}
.step .no{font-size:11px;color:var(--muted)}
.step .ty{font-weight:600;color:var(--c);display:flex;align-items:center;gap:6px;font-size:12.5px}
.step .n{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.step .d{font-size:11.5px;color:var(--muted);flex:1}
.step .st{font-size:11.5px;font-weight:600}
.step.todo{background:transparent;border-style:dashed}
.step.todo .st{color:var(--muted)}
.next{display:flex;gap:12px;align-items:center;margin-top:14px;padding:12px 16px;border:1px solid var(--primary);background:var(--tint);border-radius:12px}
.next b{flex:1;min-width:0}
/* C: รายการจัดกลุ่ม */
.cwrap{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px;align-items:start}
@media(max-width:820px){.cwrap{grid-template-columns:minmax(0,1fr)}}
details.grp{border-top:1px solid var(--border2)}
details.grp:first-of-type{border-top:0}
details.grp>summary{list-style:none;cursor:pointer;padding:11px 16px;display:flex;align-items:center;gap:10px}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary::before{content:"▾";color:var(--muted);width:12px;transition:transform .15s}
details.grp:not([open])>summary::before{transform:rotate(-90deg)}
details.grp>summary b{color:var(--c)}
details.grp>summary .d{color:var(--muted);font-size:12px;margin-left:auto}
.drow{display:flex;align-items:center;gap:10px;padding:8px 16px 8px 38px;border-top:1px solid var(--border2);background:var(--surface2)}
.drow .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail{display:flex;flex-direction:column;gap:14px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border2);border-radius:10px;overflow:hidden}
.stat div{background:var(--surface);padding:10px 12px}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:12px}
.vtool{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:9px 16px;border-top:1px solid var(--border2)}
.vtool:first-of-type{border-top:0}
.vtool:hover{background:var(--surface2)}
.vtool small{color:var(--muted);margin-left:auto}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="top">
  <div>
    <h1>หน้า Project Home</h1>
    <p>ข้อมูลจริงจากโปรเจกต์ Hotel Booking (13 เอกสาร) ลองสลับแบบ และสลับสถานะโปรเจกต์เพื่อดูว่าแต่ละแบบรับมือกรณีไหนได้</p>
  </div>
  <div class="seg" id="optSeg" role="group" aria-label="เลือกแบบ">
    <button data-v="A">A · เรียบร้อย ปรับของเดิม</button>
    <button data-v="B">B · ตามสายงานออกแบบ</button>
    <button data-v="C">C · รายการจัดกลุ่ม</button>
  </div>
</div>
<div class="opts" role="group" aria-label="สถานะโปรเจกต์">
  <span class="eyebrow">สถานะโปรเจกต์</span>
  <div class="seg" id="stSeg">
    <button data-v="full">เต็ม (Hotel Booking)</button>
    <button data-v="issues">มีปัญหาข้ามเอกสาร</button>
    <button data-v="new">โปรเจกต์ใหม่</button>
  </div>
</div>
<div class="note" id="note"></div>
<div class="win" id="win"></div>

<script>
var S={opt:'A',st:'full'};
var T=[
 {k:'req',lbl:'ความต้องการ',c:'--primary'},
 {k:'wf',lbl:'Wireframe',c:'--wf',n:7,d:'250 ชิ้นส่วน · ผูกกับ ER 46 จุด'},
 {k:'sf',lbl:'Screen Flow',c:'--sf',n:1,d:'10 หน้าจอ · 13 เส้นทาง'},
 {k:'fc',lbl:'Flowchart',c:'--fc',n:1,d:'17 สัญลักษณ์ · 3 จุดตัดสินใจ'},
 {k:'er',lbl:'ER Diagram',c:'--er',n:1,d:'9 ตาราง · 8 ความสัมพันธ์'},
 {k:'dfd',lbl:'Data Flow',c:'--dfd',n:2,d:'6 กระบวนการ · 5 คลังข้อมูล'},
 {k:'api',lbl:'API',c:'--api',n:1,d:'23 endpoint · ผูกกับตาราง 20'}
];
var DOCS=[
 ['er','ER Diagram','ER — ระบบจองห้องพัก','6 นาทีที่แล้ว'],['fc','Flowchart','Flowchart — ขั้นตอนการจอง','8 นาทีที่แล้ว'],
 ['dfd','Data Flow','DFD ระดับ 0 — ภาพรวมระบบ',''],['dfd','Data Flow','DFD ระดับ 1 — จองห้องพัก',''],
 ['wf','Wireframe','Home — หน้าแรก',''],['wf','Wireframe','Rooms — รายการห้อง',''],['wf','Wireframe','Room Detail — รายละเอียดห้อง',''],
 ['wf','Wireframe','Checkout — จองและชำระเงิน',''],['wf','Wireframe','My Bookings — การจองของฉัน',''],
 ['wf','Wireframe','Admin Dashboard — แดชบอร์ด',''],['wf','Wireframe','Admin Room — เพิ่มห้อง',''],
 ['sf','Screen Flow','Screen Flow — เว็บจองห้องพัก',''],['api','API','API — ระบบจองห้องพัก','']
];
var ISS=[{c:'dfd',t:'คลังข้อมูล "bookings" ชี้ไปตารางที่ถูกลบ',d:'DFD ระดับ 1 — จองห้องพัก'},{c:'wf',t:'ฟอร์มผูกกับคอลัมน์ที่ไม่มีอยู่แล้ว',d:'Wireframe · Checkout'}];
var col=function(k){var t=T.filter(function(x){return x.k==k})[0];return t?t.c:'--muted'};
var lbl=function(k){var t=T.filter(function(x){return x.k==k})[0];return t?t.lbl:k};
var ICON={dict:'M4 3h8v10H4zM6 6h4M6 9h4',hist:'M8 3a5 5 0 1 0 5 5M8 5v3l2 1.5M13 3v3h-3',req:'M4 3h8v10H4zM6 6l1 1 2-2M6 10h4',code:'M6 5L3 8l3 3M10 5l3 3-3 3',mock:'M3 4h10v6H3zM6 13h4M8 10v3',exp:'M8 3v7M5 7l3 3 3-3M3 13h10',plus:'M8 3v10M3 8h10'};
function ic(k){return '<svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="'+ICON[k]+'"/></svg>'}
function isNew(){return S.st=='new'}
function issues(){return S.st=='issues'?ISS:[]}
function header(withTools){
  var meta=isNew()?'0 เอกสาร · ยังไม่ได้บันทึกเป็นไฟล์':'13 เอกสาร · บันทึกล่าสุด 5 วันที่แล้ว · hotel_booking.nsln · <span class="dirty">● ยังไม่ได้บันทึก</span>';
  var tools=[['dict','พจนานุกรมข้อมูล'],['hist','ประวัติเวอร์ชัน'],['req','ความต้องการ'],['code','สร้างโค้ด'],['mock','Mock Server']];
  return '<div style="display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;justify-content:space-between"><div><div class="eyebrow">โปรเจกต์</div><div class="name">'+(isNew()?'โปรเจกต์ใหม่':'Hotel Booking')+'</div><div class="meta">'+meta+'</div></div>'
   +'<div class="tools"><button class="btn">'+ic('exp')+' ส่งออกทั้งโปรเจกต์</button><button class="btn pri">'+ic('plus')+' เอกสารใหม่</button></div></div>'
   +(withTools?'<div style="margin-top:16px"><div class="sectitle">เครื่องมือของโปรเจกต์</div><div class="tools">'+tools.map(function(t){return '<button class="btn sm">'+ic(t[0])+' '+t[1]+'</button>'}).join('')+'</div></div>':'');
}
function issuesPanel(){
  var l=issues();
  return '<div class="panel"><h3>ปัญหาข้ามเอกสาร<span class="cnt'+(l.length?' bad':'')+'">'+l.length+'</span></h3>'
   +(l.length?l.map(function(i){return '<div class="row"><span class="dot" style="background:var('+col(i.c)+')"></span><div class="t">'+i.t+'<div class="k" style="font-size:11.5px">'+i.d+'</div></div></div>'}).join(''):'<div class="empty">✓ ลิงก์ข้ามเอกสารยังครบทุกจุด</div>')
   +'<div class="linkline">ปัญหาทั้งโปรเจกต์: '+l.length+' ข้อผิดพลาด · 0 คำเตือน →</div></div>';
}
function recentPanel(onlyOpened){
  var op=DOCS.filter(function(d){return d[3]}),un=DOCS.filter(function(d){return !d[3]});
  var row=function(d){return '<div class="row"><span class="dot" style="background:var('+col(d[0])+')"></span><div class="t"><span class="k">'+d[1]+' · </span>'+d[2]+'</div>'+(d[3]?'<span class="when">'+d[3]+'</span>':'<span class="badge ok" style="background:none;color:var(--muted);font-weight:400">ยังไม่เคยเปิด</span>')+'</div>'};
  if(isNew())return '<div class="panel"><h3>เอกสารล่าสุด</h3><div class="empty">ยังไม่มีเอกสาร กด "เอกสารใหม่" เพื่อเริ่มจาก ER Diagram หรือ Wireframe</div></div>';
  if(onlyOpened)return '<div class="panel"><h3>เอกสารล่าสุด<span class="cnt">เปิดแล้ว '+op.length+'</span></h3>'+op.map(row).join('')+'<details class="more"><summary>ยังไม่เคยเปิดอีก '+un.length+' เอกสาร ▾</summary>'+un.map(row).join('')+'</details></div>';
  return '';
}
/* ---------- A ---------- */
function cardsA(){
  if(isNew())return '<div class="cards">'+T.filter(function(t){return t.k!='req'}).map(function(t){return '<button class="card add" style="--c:var('+t.c+')">'+ic('plus')+'<span>'+t.lbl+'</span></button>'}).join('')+'</div>';
  return '<div class="cards">'+T.filter(function(t){return t.k!='req'}).map(function(t){return '<button class="card" style="--c:var('+t.c+')"><div class="ty"><span class="dot" style="background:var('+t.c+')"></span>'+t.lbl+'</div><div class="n">'+t.n+'</div><div class="d">'+t.d+'</div><div class="go">เปิด →</div></button>'}).join('')+'</div>';
}
function renderA(){
  return header(true)+'<div style="height:22px"></div>'+cardsA()+'<div style="height:22px"></div><div class="grid2">'+recentPanel(true)+issuesPanel()+'</div>';
}
/* ---------- B ---------- */
function renderB(){
  var l=issues();
  var steps=T.map(function(t,i){
    var todo=isNew()||(t.k=='req'?false:!t.n);
    var cnt=t.k=='req'?(isNew()?'—':'12'):(isNew()?'—':t.n);
    var d=t.k=='req'?(isNew()?'ยังไม่มีข้อ':'12 ข้อ · ผูกกับเอกสาร 9'):t.d;
    var bad=l.filter(function(x){return x.c==t.k}).length;
    var st=isNew()?'เริ่มได้':bad?'<span style="color:var(--danger)">ปัญหา '+bad+'</span>':'<span style="color:var(--ok)">✓ ครบ</span>';
    return '<button class="step'+(isNew()?' todo':'')+'" style="--c:var('+t.c+')"><span class="no">'+(i+1)+'</span><span class="ty"><span class="dot" style="background:var('+t.c+')"></span>'+t.lbl+'</span><span class="n">'+cnt+'</span><span class="d">'+d+'</span><span class="st">'+st+'</span></button>';
  }).join('');
  var tools=[['dict','พจนานุกรม'],['hist','ประวัติเวอร์ชัน'],['code','สร้างโค้ด'],['mock','Mock Server']];
  var next=isNew()?'<div class="next"><b>เริ่มที่ขั้นแรก: เขียนความต้องการ หรือวาด Wireframe ของหน้าจอที่มีอยู่ในหัว</b><button class="btn pri">+ เอกสารใหม่</button></div>'
    :l.length?'<div class="next" style="border-color:var(--danger);background:color-mix(in srgb,var(--danger) 10%,transparent)"><b>มีลิงก์ที่ขาด '+l.length+' จุด แก้ก่อนสร้างโค้ดเพื่อให้ผลตรงกับแบบ</b><button class="btn">ดูปัญหา →</button></div>'
    :'<div class="next"><b>ทุกขั้นครบและลิงก์ไม่ขาด พร้อมสร้างโค้ดหรือเปิด Mock Server ทดสอบ API</b><button class="btn pri">สร้างโค้ด →</button></div>';
  return header(false)+'<div style="height:20px"></div><div class="sectitle">สายงานออกแบบ ความต้องการ → โค้ด</div><div class="pipe">'+steps+'</div>'+next
   +'<div style="height:22px"></div><div class="grid2">'+recentPanel(true)+'<div class="stack">'+issuesPanel()+'<div class="panel"><h3>เครื่องมือ</h3><div style="padding:12px 16px" class="tools">'+tools.map(function(t){return '<button class="btn sm">'+ic(t[0])+' '+t[1]+'</button>'}).join('')+'</div></div></div></div>';
}
/* ---------- C ---------- */
function renderC(){
  var l=issues();
  var order=['wf','sf','fc','er','dfd','api'];
  var groups=isNew()?'<div class="empty">ยังไม่มีเอกสาร</div>':order.map(function(k){
    var t=T.filter(function(x){return x.k==k})[0],docs=DOCS.filter(function(d){return d[0]==k});
    var bad=l.filter(function(x){return x.c==k}).length;
    return '<details class="grp" style="--c:var('+t.c+')"'+(k=='wf'?'':' open')+'><summary><span class="dot" style="background:var('+t.c+')"></span><b>'+t.lbl+'</b><span class="cnt">'+docs.length+'</span>'+(bad?'<span class="badge e">'+bad+'</span>':'')+'<span class="d">'+t.d+'</span></summary>'
     +docs.map(function(d){return '<div class="drow"><div class="t">'+d[2]+'</div><span class="when">'+(d[3]||'ยังไม่เคยเปิด')+'</span></div>'}).join('')+'</details>';
  }).join('');
  var tools=[['dict','พจนานุกรมข้อมูล','ตาราง · คอลัมน์'],['hist','ประวัติเวอร์ชัน','5 เวอร์ชัน'],['req','ความต้องการ','12 ข้อ'],['code','สร้างโค้ด',''],['mock','Mock Server','localhost']];
  return header(false)+'<div style="height:22px"></div><div class="cwrap"><div class="panel"><h3>เอกสารทั้งหมด<span class="cnt">'+(isNew()?0:13)+'</span></h3>'+groups+'</div>'
   +'<div class="rail"><div class="stat"><div><b>'+(isNew()?0:9)+'</b><span>ตาราง</span></div><div><b>'+(isNew()?0:23)+'</b><span>endpoint</span></div><div><b>'+(isNew()?0:10)+'</b><span>หน้าจอ</span></div><div><b>'+(isNew()?0:'18%')+'</b><span>ผูกกับ ER</span></div></div>'
   +issuesPanel()+'<div class="panel"><h3>เครื่องมือ</h3>'+tools.map(function(t){return '<button class="vtool">'+ic(t[0])+t[1]+'<small>'+t[2]+'</small></button>'}).join('')+'</div></div></div>';
}
var NOTES={
 A:'<h2>A · เรียบร้อย ปรับของเดิม</h2><ul><li>ปุ่มหลักเหลือ 2 (ส่งออก, เอกสารใหม่) ส่วนเครื่องมือย้ายไปแถบของตัวเองเป็นแถวเดียว</li><li>การ์ดทุกใบสูงเท่ากัน ปุ่ม "เปิด" อยู่ระดับเดียวกัน และแสดงเลขเอกสารกับสรุปเหมือนเดิม</li><li>เอกสารล่าสุดแสดงเฉพาะที่เคยเปิด ส่วน "ยังไม่เคยเปิด" พับเก็บ</li><li>เปลี่ยนน้อยที่สุด ใช้โค้ดเดิมได้เกือบทั้งหมด</li></ul>',
 B:'<h2>B · ตามสายงานออกแบบ</h2><ul><li>เรียง 7 ขั้นตามแผนของแอป (ความต้องการ → Wireframe → Screen Flow → Flowchart → ER → DFD → API) แต่ละขั้นบอกจำนวนและสถานะ</li><li>แถบ "ขั้นถัดไป" บอกสิ่งที่ควรทำ (เริ่ม / แก้ลิงก์ที่ขาด / สร้างโค้ด)</li><li>สายงานเป็นแนวคิดใหม่ของหน้านี้ ต้องคิดว่าขั้นไหนนับว่า "ครบ"</li></ul>',
 C:'<h2>C · รายการจัดกลุ่ม</h2><ul><li>เอกสารทั้ง 13 ชิ้นจัดกลุ่มตามชนิดและพับได้ เห็นชื่อทุกเอกสารโดยไม่ต้องเลื่อนไกล</li><li>แถบขวามีตัวเลขสำคัญ ผลตรวจ และเครื่องมือเป็นรายการแนวตั้ง</li><li>การ์ดเลขใหญ่หายไป หน้าดูเป็นเครื่องมือมากกว่าหน้าต้อนรับ</li></ul>'
};
function render(){
  document.getElementById('win').innerHTML=S.opt=='A'?renderA():S.opt=='B'?renderB():renderC();
  document.getElementById('note').innerHTML=NOTES[S.opt];
  [['optSeg','opt'],['stSeg','st']].forEach(function(x){document.querySelectorAll('#'+x[0]+' button').forEach(function(b){b.setAttribute('aria-pressed',String(S[x[1]]==b.dataset.v))})});
}
document.getElementById('optSeg').onclick=function(e){var b=e.target.closest('button');if(b){S.opt=b.dataset.v;render()}};
document.getElementById('stSeg').onclick=function(e){var b=e.target.closest('button');if(b){S.st=b.dataset.v;render()}};
render();
</script>
