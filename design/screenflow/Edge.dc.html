<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>แผงขวา Screen Flow — การเปลี่ยนหน้า</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Noto Sans Thai',system-ui,sans-serif}
button{font-family:inherit;cursor:pointer}
a{color:#8F2A52}a:hover{color:#B83B6B}
.sec{font-size:11px;font-weight:600;color:#5B6778;letter-spacing:.04em}
.fld{display:flex;flex-direction:column;gap:5px;font-size:12px;color:#5B6778}
.fld input{box-sizing:border-box;height:32px;border:1px solid #CBD3DE;border-radius:7px;padding:0 10px;font:inherit;font-size:13px;color:#1B2430;background:#fff}
.btn{height:30px;padding:0 10px;border:1px solid #D8DEE6;border-radius:7px;background:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;gap:6px}
</style>
</helmet>
<div style="width: 300px; height: 900px; box-sizing: border-box; background: #fff; border-left: 1px solid #D8DEE6; display: flex; flex-direction: column; color: #1B2430; font-size: 13px; line-height: 1.4">
<div style="display: flex; gap: 10px; align-items: center; padding: 14px 16px; border-bottom: 1px solid #E6EAF0">
<span style="width: 34px; height: 34px; border-radius: 9px; background: #FBEAF1; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="#B83B6B" stroke-width="1.8" aria-hidden="true"><path d="M2 10h14M12 6l4 4-4 4"></path></svg></span>
<span style="flex: 1"><span style="display: block; font-weight: 600; font-size: 14px">การเปลี่ยนหน้า</span><span style="display: block; font-size: 12px; color: #5B6778">หน้าจอ → หน้าจอ</span></span>
<button type="button" aria-label="ลบการเปลี่ยนหน้า" style="width: 30px; height: 30px; border: 0; border-radius: 7px; background: none; color: #B42318"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2.5 4.5h11M6 4.5V2.5h4v2M4 4.5l.8 9h6.4l.8-9"></path></svg></button>
</div>
<div style="flex: 1; overflow: hidden; padding: 14px 16px; display: flex; flex-direction: column; gap: 14px">
<label class="fld">เมื่อ (trigger)<input value="ยืมเล่มนี้"></label>
<label class="fld">เงื่อนไข (ไม่บังคับ)<input value="หนังสือว่าง"></label>

<div style="display: flex; flex-direction: column; gap: 6px">
<div class="sec">จากหน้าไหนไปหน้าไหน</div>
<div style="display: flex; align-items: center; gap: 8px; padding: 10px; border: 1px solid #E6EAF0; border-radius: 10px">
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center">
<span style="width: 64px; height: 40px; border: 1px solid #D8DEE6; border-radius: 4px; background: linear-gradient(#EEF1F5 0 7px, #fff 7px)"></span>
<span style="font-size: 12px; font-weight: 600">ค้นหาหนังสือ</span>
</span>
<svg width="22" height="12" viewBox="0 0 22 12" fill="none" stroke="#B83B6B" stroke-width="1.8" aria-hidden="true"><path d="M1 6h19M16 2l4 4-4 4"></path></svg>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center">
<span style="width: 26px; height: 40px; border: 1px solid #D8DEE6; border-radius: 4px; background: linear-gradient(#EEF1F5 0 6px, #fff 6px)"></span>
<span style="font-size: 12px; font-weight: 600">ยืมหนังสือ</span>
</span>
</div>
<button type="button" class="btn"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 5h10M9 2l3 3-3 3M14 11H4M7 8l-3 3 3 3"></path></svg>สลับทิศทาง</button>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<div class="sec">เรียก API ระหว่างเปลี่ยนหน้า</div>
<div style="display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px; border: 1px dashed #CBD3DE; border-radius: 8px; color: #5B6778; font-size: 12.5px">
<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M5 4L2 8l3 4M11 4l3 4-3 4"></path></svg>
<span style="flex: 1">ไม่เรียก</span><a href="#" style="font-size: 12px">เลือก endpoint…</a>
</div>
<span style="font-size: 11.5px; color: #5B6778">ปุ่ม “ยืมเล่มนี้” ใน Wireframe เรียก <span style="font-family: 'JetBrains Mono', monospace; color: #1E3A6B">POST /loans</span> — <a href="#">ใช้ endpoint เดียวกัน</a></span>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<div class="sec">เส้นและป้าย</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px">
<button type="button" class="btn">จัดเส้นอัตโนมัติ</button>
<button type="button" class="btn">ป้ายกลับที่เดิม</button>
</div>
<span style="font-size: 11.5px; color: #5B6778">ลากจุดกลางเส้นเพื่อดัด · ลากป้ายเพื่อย้าย</span>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":300,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
