<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>แผงขวา Wireframe แบบ A</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Noto Sans Thai',system-ui,sans-serif}
</style>
</helmet>
<div style="width:400px;height:900px;box-sizing:border-box;background:#131b26;border-left:1px solid #263344;color:#e8eef5;display:flex;flex-direction:column;font-family:'Noto Sans Thai',system-ui,sans-serif;font-size:13px">

<!-- หัว -->
<div style="display:flex;gap:12px;align-items:center;padding:18px 20px 16px;border-bottom:1px solid #263344">
<div style="width:36px;height:36px;border-radius:9px;background:rgba(224,144,43,.16);display:flex;align-items:center;justify-content:center;flex-shrink:0">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#f0a94a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 9v11"/></svg>
</div>
<div style="flex-grow:1;min-width:0">
<div style="font-size:15px;font-weight:600">Wireframe</div>
<div style="font-size:12px;color:#93a1b3;margin-top:2px">หน้าจอเดสก์ท็อป · 0 ชิ้นส่วน</div>
</div>
</div>

<div style="flex-grow:1;overflow:hidden;display:flex;flex-direction:column">

<!-- การแสดงผล -->
<div style="padding:18px 20px;border-bottom:1px solid #263344;display:flex;flex-direction:column;gap:14px">
<div style="font-size:11px;font-weight:600;letter-spacing:.06em;color:#93a1b3">การแสดงผล</div>
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
<button type="button" style="all:unset;box-sizing:border-box;cursor:pointer;border:1px solid #263344;border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;background:#17212e">
<span style="font-weight:600;font-size:13px">ร่าง</span>
<span style="font-size:11.5px;color:#93a1b3">ขาวดำ เส้นวาดมือ</span>
</button>
<button type="button" style="all:unset;box-sizing:border-box;cursor:pointer;border:1.5px solid #34c3a8;border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;background:rgba(52,195,168,.12)">
<span style="font-weight:600;font-size:13px;color:#8be9d6">เรียบร้อย</span>
<span style="font-size:11.5px;color:#93a1b3">UI สีสว่าง มีสีเน้น</span>
</button>
</div>
<div style="display:flex;flex-direction:column;gap:8px">
<div style="font-size:12px;color:#93a1b3">สีเน้น</div>
<div style="display:flex;gap:10px;align-items:center">
<span style="width:26px;height:26px;border-radius:50%;background:#2f6bff;box-shadow:0 0 0 2px #131b26,0 0 0 4px #e8eef5"></span>
<span style="width:26px;height:26px;border-radius:50%;background:#1fa65a"></span>
<span style="width:26px;height:26px;border-radius:50%;background:#e0312f"></span>
<span style="width:26px;height:26px;border-radius:50%;background:#e8851a"></span>
<span style="width:26px;height:26px;border-radius:50%;background:#14a39a"></span>
<span style="width:26px;height:26px;border-radius:50%;background:#7c3aed"></span>
<span style="width:26px;height:26px;border-radius:50%;background:#e0267a"></span>
<span style="width:26px;height:26px;border-radius:50%;border:1px dashed #5a6b80;display:flex;align-items:center;justify-content:center">
<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#93a1b3" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
</span>
</div>
</div>
</div>

<!-- ขนาด -->
<div style="padding:18px 20px;border-bottom:1px solid #263344;display:flex;flex-direction:column;gap:14px">
<div style="font-size:11px;font-weight:600;letter-spacing:.06em;color:#93a1b3">ขนาดหน้าจอ</div>
<div style="display:flex;gap:8px;flex-wrap:wrap">
<button type="button" style="all:unset;cursor:pointer;box-sizing:border-box;height:32px;padding:0 12px;border-radius:16px;background:rgba(52,195,168,.16);border:1px solid #34c3a8;color:#8be9d6;font-size:12.5px;display:flex;align-items:center">เดสก์ท็อป</button>
<button type="button" style="all:unset;cursor:pointer;box-sizing:border-box;height:32px;padding:0 12px;border-radius:16px;border:1px solid #263344;font-size:12.5px;display:flex;align-items:center">แท็บเล็ต</button>
<button type="button" style="all:unset;cursor:pointer;box-sizing:border-box;height:32px;padding:0 12px;border-radius:16px;border:1px solid #263344;font-size:12.5px;display:flex;align-items:center">มือถือ</button>
<button type="button" style="all:unset;cursor:pointer;box-sizing:border-box;height:32px;padding:0 12px;border-radius:16px;border:1px solid #263344;font-size:12.5px;display:flex;align-items:center">กำหนดเอง</button>
</div>
<div style="display:flex;gap:8px;align-items:center">
<label style="flex:1;display:flex;flex-direction:column;gap:4px;font-size:12px;color:#93a1b3">กว้าง
<input value="1440" style="box-sizing:border-box;height:34px;border-radius:8px;border:1px solid #263344;background:#0e151e;color:#e8eef5;padding:0 10px;font:inherit;font-size:13px">
</label>
<span style="color:#93a1b3;padding-top:18px">×</span>
<label style="flex:1;display:flex;flex-direction:column;gap:4px;font-size:12px;color:#93a1b3">สูง
<input value="900" style="box-sizing:border-box;height:34px;border-radius:8px;border:1px solid #263344;background:#0e151e;color:#e8eef5;padding:0 10px;font:inherit;font-size:13px">
</label>
</div>
</div>

<!-- ตรวจสอบ -->
<div style="padding:18px 20px;display:flex;flex-direction:column;gap:12px">
<div style="display:flex;align-items:center;justify-content:space-between">
<div style="font-size:11px;font-weight:600;letter-spacing:.06em;color:#93a1b3">ตรวจสอบ</div>
<div style="display:flex;gap:6px">
<span style="font-size:11.5px;padding:2px 8px;border-radius:10px;background:#1a2432;color:#93a1b3">ผิดพลาด 0</span>
<span style="font-size:11.5px;padding:2px 8px;border-radius:10px;background:#1a2432;color:#93a1b3">เตือน 0</span>
</div>
</div>
<div style="display:flex;gap:10px;align-items:center;padding:12px;border-radius:10px;background:rgba(52,195,168,.10)">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5fd9c2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
<span style="color:#8be9d6">ไม่พบปัญหา</span>
</div>
</div>

</div>

<!-- เคล็ดลับตอนยังว่าง -->
<div style="padding:14px 20px 18px;border-top:1px solid #263344;display:flex;flex-direction:column;gap:8px">
<div style="font-size:12px;color:#93a1b3">หน้าจอยังว่าง — กดคีย์ลัดแล้วคลิกในกรอบ</div>
<div style="display:flex;gap:6px;flex-wrap:wrap">
<span style="font-size:12px;padding:4px 9px;border-radius:7px;background:#1a2432"><b style="color:#8be9d6">T</b> ป้าย</span>
<span style="font-size:12px;padding:4px 9px;border-radius:7px;background:#1a2432"><b style="color:#8be9d6">B</b> ปุ่ม</span>
<span style="font-size:12px;padding:4px 9px;border-radius:7px;background:#1a2432"><b style="color:#8be9d6">L</b> ช่องกรอก</span>
<span style="font-size:12px;padding:4px 9px;border-radius:7px;background:#1a2432"><b style="color:#8be9d6">R</b> กล่อง</span>
<span style="font-size:12px;padding:4px 9px;border-radius:7px;background:#1a2432"><b style="color:#8be9d6">G</b> รูปภาพ</span>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":400,"height":900}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
