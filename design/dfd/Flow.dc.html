<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>แผงขวา DFD — เส้นข้อมูล</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Noto Sans Thai',system-ui,sans-serif}
button{font-family:inherit;cursor:pointer}
a{color:#1E3A6B}a:hover{color:#2F6FB5}
.sec{font-size:11px;font-weight:600;color:#5B6778;letter-spacing:.04em}
.fld{display:flex;flex-direction:column;gap:5px;font-size:12px;color:#5B6778}
.fld input{box-sizing:border-box;height:32px;border:1px solid #CBD3DE;border-radius:7px;padding:0 10px;font:inherit;font-size:13px;color:#1B2430;background:#fff}
.btn{height:30px;padding:0 10px;border:1px solid #D8DEE6;border-radius:7px;background:#fff;font-size:12px;display:flex;align-items:center;gap:6px}
</style>
</helmet>
<div style="width: 300px; height: 900px; box-sizing: border-box; background: #fff; border-left: 1px solid #D8DEE6; display: flex; flex-direction: column; color: #1B2430; font-size: 13px; line-height: 1.4">
<div style="display: flex; gap: 10px; align-items: center; padding: 14px 16px; border-bottom: 1px solid #E6EAF0">
<span style="width: 34px; height: 34px; border-radius: 9px; background: #E8EEF8; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="#2F6FB5" stroke-width="1.8" aria-hidden="true"><path d="M2 10h14M12 6l4 4-4 4"></path></svg></span>
<span style="flex: 1"><span style="display: block; font-weight: 600; font-size: 14px">เส้นข้อมูล</span><span style="display: block; font-size: 12px; color: #5B6778">ระหว่างกระบวนการกับที่เก็บข้อมูล</span></span>
<button type="button" aria-label="ลบเส้นข้อมูล" style="width: 30px; height: 30px; border: 0; border-radius: 7px; background: none; color: #B42318"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2.5 4.5h11M6 4.5V2.5h4v2M4 4.5l.8 9h6.4l.8-9"></path></svg></button>
</div>
<div style="flex: 1; overflow: hidden; padding: 14px 16px; display: flex; flex-direction: column; gap: 14px">
<label class="fld">ชื่อข้อมูลที่ไหล<input value="การยืมใหม่"></label>

<div style="display: flex; flex-direction: column; gap: 6px">
<div class="sec">ทิศทาง</div>
<div style="display: flex; align-items: center; gap: 8px; padding: 10px 12px; border: 1px solid #E6EAF0; border-radius: 10px">
<span style="flex: 1; min-width: 0"><span style="display: block; font-size: 11px; color: #5B6778">จาก</span><span style="display: block; font-weight: 600"><span style="font-family: 'JetBrains Mono', monospace; color: #1E3A6B">1.0</span> ยืมหนังสือ</span></span>
<svg width="18" height="12" viewBox="0 0 18 12" fill="none" stroke="#2F6FB5" stroke-width="1.8" aria-hidden="true"><path d="M1 6h15M12 2l4 4-4 4"></path></svg>
<span style="flex: 1; min-width: 0; text-align: right"><span style="display: block; font-size: 11px; color: #5B6778">ไป</span><span style="display: block; font-weight: 600"><span style="font-family: 'JetBrains Mono', monospace; color: #1E3A6B">D3</span> การยืม</span></span>
</div>
<div style="display: flex; gap: 6px">
<button type="button" class="btn"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 5h10M9 2l3 3-3 3M14 11H4M7 8l-3 3 3 3"></path></svg>สลับทิศทาง</button>
<label class="btn" style="flex: 1"><input type="checkbox" style="margin: 0">ไหลสองทาง</label>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<div class="sec">เส้นและป้าย</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px">
<button type="button" class="btn" style="justify-content: center">จัดเส้นอัตโนมัติ</button>
<button type="button" class="btn" style="justify-content: center">ป้ายกลับที่เดิม</button>
</div>
<span style="font-size: 11.5px; color: #5B6778">ลากจุดกลางเส้นเพื่อดัด · ลากป้ายเพื่อย้าย</span>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<div class="sec">สีเส้น</div>
<div style="display: flex; gap: 8px; align-items: center">
<span style="height: 24px; padding: 0 9px; border-radius: 12px; border: 1.5px solid #2F6FB5; color: #1E3A6B; font-size: 11.5px; display: flex; align-items: center">เริ่มต้น</span>
<span style="width: 22px; height: 22px; border-radius: 50%; background: #0F766E"></span>
<span style="width: 22px; height: 22px; border-radius: 50%; background: #B7791F"></span>
<span style="width: 22px; height: 22px; border-radius: 50%; background: #B42318"></span>
<span style="width: 22px; height: 22px; border-radius: 50%; border: 1px dashed #5B6778; color: #5B6778; font-size: 14px; display: flex; align-items: center; justify-content: center">+</span>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<div class="sec">สมดุลกับระดับบน</div>
<div style="padding: 10px 12px; border-radius: 9px; background: #F3F5F8; font-size: 12px; color: #5B6778">เส้นนี้อยู่ภายในระบบ (กระบวนการ → ที่เก็บข้อมูล) ไม่ต้องมีคู่ในระดับ 0</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":300,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
