  return '<div class="home"><div style="color:var(--muted);font-size:12px">โปรเจกต์</div><div class="hname">Hotel Booking</div><div style="color:var(--muted)">14 เอกสาร · hotel_booking.nsln</div><div style="margin:14px 0 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center"><span class="eyebrow">เครื่องมือของโปรเจกต์</span>'+tools+'</div><div class="cards" style="'+(v=='A'?'grid-template-columns:repeat(7,minmax(0,1fr))':'')+'">'+cards+'</div>'+strip+'</div>';
}
/* ---------- Diagram ---------- */
function dgSvg(){
  var ell=function(id){var u=UC[id];return '<g class="uce'+(S.sel==id?' sel':'')+'" data-uc="'+id+'" tabindex="0" role="button" aria-label="'+u.n+'"><ellipse cx="'+u.x+'" cy="'+u.y+'" rx="92" ry="36"/><text x="'+u.x+'" y="'+(u.y-3)+'" text-anchor="middle" font-size="13" font-weight="600">'+u.n+'</text><text x="'+u.x+'" y="'+(u.y+14)+'" text-anchor="middle" font-size="11" style="fill:var(--muted)">'+id+'</text></g>'};
  var actor=function(x,y,n){return '<g><circle cx="'+x+'" cy="'+(y-24)+'" r="10" fill="none" stroke="currentColor" stroke-width="1.6" style="color:var(--text)"/><path d="M'+x+' '+(y-14)+'v26M'+(x-16)+' '+(y-4)+'h32M'+x+' '+(y+12)+'l-13 18M'+x+' '+(y+12)+'l13 18" fill="none" stroke="currentColor" stroke-width="1.6" style="color:var(--text)"/><text x="'+x+'" y="'+(y+48)+'" text-anchor="middle" font-size="12.5" font-weight="600">'+n+'</text></g>'};
  var ln=function(x1,y1,x2,y2,d,t){return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="currentColor" stroke-width="1.3" style="color:var(--muted)"'+(d?' stroke-dasharray="6 4" marker-end="url(#ar)"':'')+'/>'+(t?'<text x="'+((x1+x2)/2)+'" y="'+((y1+y2)/2-6)+'" text-anchor="middle" font-size="11" font-style="italic" style="fill:var(--muted)">'+t+'</text>':'')};
  return '<svg viewBox="0 0 760 470" role="img" aria-label="แผนภาพ Use Case"><defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="none" stroke="currentColor" style="color:var(--muted)"/></marker></defs>'
   +'<rect x="150" y="30" width="470" height="420" rx="12" fill="none" stroke="currentColor" stroke-width="1.4" style="color:var(--border)"/><text x="168" y="54" font-size="12.5" font-weight="600" style="fill:var(--muted)">Hotel Booking</text>'
   +ln(78,190,148,130)+ln(78,190,148,260)+ln(78,190,148,390)+ln(78,420,148,390)+ln(640,230,572,260)
   +ln(332,260,388,260,1,'«include»')+ln(480,166,300,236,0)+ln(388,130,332,130)
   +actor(60,190,'Guest')+actor(60,420,'Admin')+actor(700,250,'Payment Gateway')
   +['UC-01','UC-02','UC-03','UC-04','UC-05'].map(ell).join('')+'</svg>';
}
function dgInfo(){
  var u=UC[S.sel];
  return '<h3>'+u.n+'</h3><div class="mono" style="color:var(--muted);margin-bottom:8px">'+S.sel+' · ผู้กระทำ '+u.a+'</div>'
   +'<div class="lbl">เป้าหมาย</div><div>ให้ผู้เข้าพักจองห้องและได้รับการยืนยันภายในครั้งเดียว</div>'
   +'<div class="lbl">ขั้นตอน · ทางเลือก</div><div>6 ขั้นตอน · 2 ทางเลือก · 1 ข้อผิดพลาด</div>'
   +'<div class="lbl">ความต้องการ</div><div style="display:flex;gap:6px"><span class="chip req">REQ-03</span><span class="chip req">REQ-07</span></div>'
   +(S.v.dg=='B'?'<div class="lbl">ผลตรวจ</div><div style="color:var(--warn)">⚠ ขั้นที่ 6 ยังไม่ผูก endpoint</div>':'')
   +'<div style="margin-top:12px"><button class="btn pri">แก้สเปก →</button></div>';
}
function dg(){
  var v=S.v.dg;
  var tb='<div class="bar"><b>แผนภาพ</b><span class="chip">5 Use Case · 3 ผู้กระทำ</span><span class="sp"></span><button class="btn sm">−</button><span class="kb">100%</span><button class="btn sm">+</button><button class="btn sm">พอดีจอ</button><button class="btn sm">จัดวางใหม่</button><button class="btn sm" aria-pressed="true">ตำนาน</button><button class="btn" data-menu="1">ส่งออก ▾</button></div>';
  var menu=S.menu?'<div class="menu"><button>PNG<small>ภาพความละเอียดสูงสำหรับเอกสาร</small></button><button>SVG<small>เวกเตอร์ แก้ต่อใน Figma/Inkscape</small></button></div>':'';
  var legend='<div style="position:absolute;right:14px;bottom:14px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:11.5px;color:var(--muted)">— ผู้กระทำ ⇢ <i>«include»</i> / <i>«extend»</i> (เส้นประ)</div>';
  var canvas='<div class="canvas">'+dgSvg()+(v=='A'?'<div class="float">'+dgInfo()+'</div>':'')+legend+'</div>';
  if(v=='A')return tb+menu+'<div class="dgwrap">'+canvas+'</div>';
  return tb+menu+'<div class="dgwrap B">'+canvas+'<div class="side">'+dgInfo()+'</div></div>';
}
/* ---------- Test cases ---------- */
function stepsHtml(c){return c.steps.map(function(s){return '<li><span class="who '+s[0]+'">'+(s[0]=='u'?'ผู้ใช้':'ระบบ')+'</span>'+esc(s[1])+'</li>'}).join('')}
function tcHead(){
  return '<div class="bar"><b>กรณีทดสอบ</b><span class="chip">12 กรณี</span><span class="chip">หลัก 5</span><span class="chip">ทางเลือก 5</span><span class="chip">ข้อผิดพลาด 2</span><span class="chip req">REQ 3/5 มีกรณีทดสอบ</span><span class="sp"></span>'
   +'<button class="btn sm">ทุกชนิด ▾</button><button class="btn sm">ทุก Use Case ▾</button><button class="btn pri" data-menu="1">ส่งออก ▾</button></div>'
   +(S.menu?'<div class="menu"><button data-fmt="table">Markdown · ตาราง<small>ขั้นตอน / ผลที่คาดหวัง (ค่าเริ่มต้น)</small></button><button data-fmt="gwt">Markdown · Given/When/Then<small>อ่านเป็นประโยคทดสอบ</small></button><button data-fmt="csv">CSV<small>เปิดใน Excel/Sheets · ภาษาไทยไม่เพี้ยน (UTF-8 BOM)</small></button></div>':'');
}
function tc(){
  var v=S.v.tc,h=tcHead();
  if(v=='A'){
    var rows=TCS.map(function(c){var o=S.open[c.id];return '<tr class="rowbtn" data-tc="'+c.id+'"><td class="mono" style="white-space:nowrap">'+(o?'▾ ':'▸ ')+c.id+'</td><td>'+UC[c.uc].n+'</td><td><span class="kind '+c.k+'">'+c.t+'</span></td><td>'+esc(c.pre)+(o?'<ol class="steps">'+stepsHtml(c)+'</ol>':'')+'</td><td>'+esc(c.exp)+'</td><td style="color:var(--muted);font-size:12px">'+esc(c.refs)+'</td></tr>'}).join('');
    return h+'<div style="overflow-x:auto"><table class="tc"><thead><tr><th>รหัส</th><th>Use Case</th><th>ประเภท</th><th>เงื่อนไขก่อนเริ่ม / ขั้นตอน</th><th>ผลที่คาดหวัง</th><th>อ้างอิง</th></tr></thead><tbody>'+rows+'</tbody></table></div><div style="padding:10px 14px;color:var(--muted);font-size:12px">แสดง 5 จาก 12 กรณี · กดแถวเพื่อ'+'ขยายขั้นตอน</div>';
  }
  var by={};TCS.forEach(function(c){(by[c.uc]=by[c.uc]||[]).push(c)});
  return h+Object.keys(by).map(function(u){return '<div class="grp"><h3>'+ucDot('uc')+'<span class="mono" style="color:var(--muted)">'+u+'</span> '+UC[u].n+'<span class="chip" style="margin-left:auto">'+by[u].length+' กรณี</span></h3>'+by[u].map(function(c){return '<div class="tcard"><div class="hd"><span class="mono" style="font-weight:600">'+c.id+'</span><span class="kind '+c.k+'">'+c.t+'</span><span style="color:var(--muted);font-size:12px">'+esc(c.refs)+'</span></div><div style="color:var(--muted);margin-top:4px">ก่อนเริ่ม: '+esc(c.pre)+'</div><ol>'+stepsHtml(c)+'</ol><div class="exp"><b>ผลที่คาดหวัง</b> '+esc(c.exp)+'</div></div>'}).join('')+'</div>'}).join('');
}
function render(){
  var t=S.top;
  document.getElementById('win').innerHTML=t=='home'?home():t=='dg'?dg():tc();
  document.getElementById('note').innerHTML=NOTES[t][S.v[t]];
  document.getElementById('varSeg').innerHTML=VARS[t].map(function(x){return '<button data-v="'+x[0]+'" aria-pressed="'+(S.v[t]==x[0])+'">'+x[1]+'</button>'}).join('');
  document.querySelectorAll('#topSeg button').forEach(function(b){b.setAttribute('aria-pressed',String(S.top==b.dataset.v))});
}
document.getElementById('topSeg').onclick=function(e){var b=e.target.closest('button');if(b){S.top=b.dataset.v;S.menu=false;render()}};
document.getElementById('varSeg').onclick=function(e){var b=e.target.closest('button');if(b){S.v[S.top]=b.dataset.v;S.menu=false;render()}};
document.getElementById('win').onclick=function(e){
  if(e.target.closest('[data-menu]')){S.menu=!S.menu;render();return}
  var f=e.target.closest('[data-fmt]');if(f){S.menu=false;render();return}
  var u=e.target.closest('[data-uc]');if(u){S.sel=u.dataset.uc;render();return}
  var r=e.target.closest('[data-tc]');if(r){S.open[r.dataset.tc]=!S.open[r.dataset.tc];render();return}
  if(S.menu){S.menu=false;render()}
};
document.getElementById('win').onkeydown=function(e){if(e.key=='Enter'||e.key==' '){var u=e.target.closest('[data-uc]');if(u){e.preventDefault();S.sel=u.dataset.uc;render()}}};
render();
</script>
