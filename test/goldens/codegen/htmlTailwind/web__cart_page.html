<style>

</div>
<script>
// หน้าต่างแคบกว่าแบบ = ย่อทั้งหน้าให้พอดีความกว้าง (คงสัดส่วนตามแบบ)
(function () {
  var stage = document.getElementById("wf-stage"), page = document.getElementById("wf-page");
  var W = 1440, H = 900;
  function fit() {
    var k = Math.min(1, (document.documentElement.clientWidth - 32) / W);
    page.style.transform = k < 1 ? "scale(" + k + ")" : "";
    stage.style.width = W * k + "px";
    stage.style.height = H * k + "px";
  }
  window.addEventListener("resize", fit);
  fit();
})();
</script>
</body>
</html>
